<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>Reclutamiento · BETABOT</title>
  <meta name="theme-color" content="#050703" />
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('betabot-tema'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #000000;
      --navy-dark: #1a1a1a;
      --blue: #92d100;
      --bg: #f2f3f0;
      --surface: #ffffff;
      --text: #1b2733;
      --muted: #5b6b7b;
      --border: #c9d2dc;
      --success-bg: #e8f3ec;
      --success-text: #1e5b35;
      --error-bg: #fbeaea;
      --error-text: #8a1f1f;
      --bubble-bot: #eef1ea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    /* ====== Distribución: chat (columna) + formulario ====== */
    .layout {
      max-width: 1040px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 380px minmax(0, 1fr);
      gap: 1.5rem;
      align-items: start;
    }

    .container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .header {
      background: var(--navy);
      color: #fff;
      padding: 1.75rem 2rem;
      border-bottom: 4px solid var(--blue);
    }
    .header h2 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: 0.2px; }
    .header p { margin: 0.35rem 0 0; font-size: 0.95rem; color: #d4d4d4; }

    form {
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem 1rem;
    }
    .field { display: flex; flex-direction: column; }
    .full { grid-column: 1 / -1; }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    input[type="text"], input[type="tel"], input[type="email"], select {
      width: 100%;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    select:disabled { background: #f1f2f4; color: #7b8794; }
    input::placeholder { color: #8a97a5; }
    input:focus, select:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(146, 209, 0, 0.35);
    }

    #problemForm > button[type="submit"] {
      grid-column: 1 / -1;
      margin-top: 0.5rem;
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      color: #000;
      background: var(--blue);
      border: 1px solid var(--blue);
      border-radius: 4px;
      padding: 0.8rem 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #problemForm > button[type="submit"]:hover { background: #7db800; border-color: #7db800; }
    button:focus-visible {
      outline: 3px solid rgba(146, 209, 0, 0.6);
      outline-offset: 2px;
    }

    #status { padding: 0 2rem 2rem; }
    #status:empty { padding: 0; }
    .success, .error {
      padding: 0.9rem 1rem;
      border-radius: 4px;
      font-size: 0.95rem;
      border-left: 4px solid;
    }
    .success { background: var(--success-bg); color: var(--success-text); border-color: #2e7d4f; }
    .error { background: var(--error-bg); color: var(--error-text); border-color: #b33a3a; }

    fieldset.docs {
      border: 1px solid var(--border);
      border-radius: 4px;
      margin: 0;
      padding: 0.9rem 1rem 1rem;
    }
    fieldset.docs legend { font-size: 0.875rem; font-weight: 500; padding: 0 0.4rem; }
    .docs-hint { margin: 0 0 0.6rem; font-size: 0.85rem; color: var(--muted); }
    .docs-note {
      margin: 0.6rem 0 0;
      padding: 0.7rem 0.85rem;
      font-size: 0.875rem;
      background: #f6fbe9;
      border-left: 4px solid var(--blue);
      border-radius: 4px;
      color: #33430a;
    }
    label.check {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0;
      padding: 0.45rem 0;
      font-weight: 400;
      font-size: 0.95rem;
      cursor: pointer;
    }
    label.check input[type="checkbox"] {
      width: 1.15rem;
      height: 1.15rem;
      padding: 0;
      margin: 0;
      flex: none;
      accent-color: var(--blue);
    }
    .hidden { display: none !important; }

    /* ====== Chat ====== */
    .chat {
      position: sticky;
      top: 1rem;
      display: flex;
      flex-direction: column;
      height: min(640px, calc(100vh - 2rem));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }
    .chat-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.9rem 1.1rem;
      background: var(--navy);
      color: #fff;
      border-bottom: 4px solid var(--blue);
    }
    .chat-avatar {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 50%;
      background: var(--blue);
      color: #000;
      font-weight: 700;
      display: grid;
      place-items: center;
      flex: none;
    }
    .chat-title { flex: 1; min-width: 0; }
    .chat-title strong { display: block; font-size: 0.98rem; font-weight: 600; }
    .chat-title span { font-size: 0.8rem; color: #c9c9c9; }
    .chat-restart {
      font: inherit;
      font-size: 0.8rem;
      color: #fff;
      background: transparent;
      border: 1px solid #5a5a5a;
      border-radius: 4px;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
    }
    .chat-restart:hover { border-color: var(--blue); color: var(--blue); }

    .chat-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      background: #fafbf8;
    }
    .msg {
      max-width: 88%;
      padding: 0.6rem 0.8rem;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .msg.bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 3px; }
    .msg.user { align-self: flex-end; background: var(--blue); color: #000; border-bottom-right-radius: 3px; }
    .msg img { display: block; max-width: 150px; border-radius: 6px; margin-bottom: 0.35rem; }

    .msg.typing { display: flex; gap: 4px; padding: 0.75rem 0.9rem; }
    .msg.typing span {
      width: 6px; height: 6px; border-radius: 50%; background: #8a9480;
      animation: blink 1.2s infinite ease-in-out;
    }
    .msg.typing span:nth-child(2) { animation-delay: 0.2s; }
    .msg.typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      max-height: 220px;
      overflow-y: auto;
      padding: 0.1rem 0 0.3rem;
    }
    .chip {
      font: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--blue);
      border-radius: 999px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      transition: background 0.12s;
    }
    .chip:hover { background: #eef8d4; }
    .chip.primary { background: var(--blue); color: #000; font-weight: 600; }
    .chip.primary:hover { background: #7db800; }
    .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .chat { position: static; height: 520px; }
    }
    @media (max-width: 520px) {
      body { padding: 0; }
      .layout { gap: 0; }
      .container, .chat { border-radius: 0; border-left: 0; border-right: 0; }
      form { grid-template-columns: 1fr; padding: 1.5rem; }
      .header { padding: 1.5rem; }
      #status { padding: 0 1.5rem 1.5rem; }
    }

    /* Cabeza de BETABOT recortada de la imagen completa (se escala con --d) */
    .bot-face {
      --d: 40px;
      width: var(--d);
      height: var(--d);
      flex: none;
      border-radius: 50%;
      background-color: #000;
      background-image: var(--bot-img);
      background-repeat: no-repeat;
      background-size: calc(var(--d) * 2.695) auto;
      background-position: 44.25% 0;
      box-shadow: 0 0 0 2px var(--blue), 0 0 14px rgba(146, 209, 0, 0.55);
    }

    /* Mascota en el encabezado del formulario */
    .header { position: relative; min-height: 170px; padding-right: 150px; overflow: hidden; }
    .hero-bot {
      position: absolute;
      right: 0;
      bottom: 0;
      height: 100%;
      aspect-ratio: 580 / 820;
      background-image: var(--bot-img);
      background-repeat: no-repeat;
      background-size: 176.55% auto;
      background-position: 42.8% 0;
      mix-blend-mode: lighten;
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 30%);
      mask-image: linear-gradient(to right, transparent 0, #000 30%);
      pointer-events: none;
    }

    /* Chat en versión oscura con neón */
    .chat {
      background: #050703;
      border-color: #1c2607;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(146, 209, 0, 0.12);
      height: min(700px, calc(100vh - 2rem));
    }
    .chat-header {
      background: radial-gradient(120% 160% at 0% 0%, #1b2a00 0%, #000 60%);
      border-bottom: 0;
      padding: 0.85rem 1rem 0.5rem;
    }
    .chat-header .bot-face { --d: 54px; }
    .chat-title strong {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-shadow: 0 0 12px rgba(146, 209, 0, 0.55);
    }
    .chat-title span { color: #b9c9a0; }
    .chat-msgs {
      background:
        radial-gradient(120% 50% at 50% 115%, rgba(146, 209, 0, 0.16), transparent 65%),
        #050703;
      scrollbar-color: #2c3a0f #050703;
    }
    .fila { display: flex; gap: 0.5rem; align-items: flex-end; max-width: 94%; align-self: flex-start; }
    .fila .bot-face { --d: 28px; box-shadow: 0 0 0 1.5px var(--blue); margin-bottom: 2px; }
    .fila .msg { align-self: auto; max-width: 100%; }
    .msg.bot { background: #131a0b; color: #eaf3d6; border: 1px solid rgba(146, 209, 0, 0.28); }
    .msg.user { box-shadow: 0 0 12px rgba(146, 209, 0, 0.25); }
    .msg.typing span { background: var(--blue); }
    .msg img { max-width: 180px; }
    .chip { background: #0f1508; color: #e8f2cf; border-color: rgba(146, 209, 0, 0.7); }
    .chip:hover { background: #1b2a00; box-shadow: 0 0 10px rgba(146, 209, 0, 0.35); }
    .chip.primary { background: var(--blue); color: #000; }
    .chip.primary:hover { background: #a6ee00; }
    .chip.on { background: var(--blue); color: #000; border-color: var(--blue); }
    .guardar {
      display: inline-block;
      margin-top: 0.4rem;
      font: inherit;
      font-size: 0.78rem;
      color: #000;
      background: rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(0, 0, 0, 0.45);
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      cursor: pointer;
    }
    .guardar:hover { background: rgba(0, 0, 0, 0.22); }

    /* ====== Barra de progreso: BETABOT corre hacia la meta ====== */
    .prog { background: #000; padding: 0.2rem 1rem 0.8rem; border-bottom: 3px solid var(--blue); }
    .prog-track {
      position: relative;
      height: 10px;
      margin: 24px 20px 0 18px;
      border-radius: 99px;
      background: #1b1f14;
      border: 1px solid #2c3a0f;
    }
    .prog-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: 99px;
      background: repeating-linear-gradient(-45deg, #92d100 0 7px, #b7f000 7px 14px);
      background-size: 19.8px 100%;
      box-shadow: 0 0 10px rgba(146, 209, 0, 0.6);
      transition: width 0.8s cubic-bezier(0.3, 0.7, 0.2, 1);
    }
    .prog.run .prog-fill { animation: avanzar 0.5s linear infinite; }
    @keyframes avanzar { to { background-position: 19.8px 0; } }
    .prog-dot {
      position: absolute;
      top: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #394a14;
      transform: translate(-50%, -50%);
    }
    .prog-dot.on { background: #000; }
    .prog-meta { position: absolute; right: -22px; top: 50%; transform: translateY(-50%); font-size: 15px; line-height: 1; }
    .runner {
      --d: 36px;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translate(-50%, -50%);
      transition: left 0.8s cubic-bezier(0.3, 0.7, 0.2, 1);
      z-index: 2;
    }
    .prog.run .runner { animation: trote 0.35s ease-in-out infinite; }
    @keyframes trote { 50% { transform: translate(-50%, -72%); } }
    .prog.meta .runner { box-shadow: 0 0 0 2px var(--blue), 0 0 24px 4px rgba(146, 209, 0, 0.8); }
    .prog-steps {
      list-style: none;
      margin: 0.7rem 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      font-size: 0.68rem;
      color: #6d7a55;
      text-align: center;
    }
    .prog-steps li.hecho { color: #b9d96a; }
    .prog-steps li.actual { color: #fff; font-weight: 600; }


    @media (max-width: 520px) {
      .header { padding-right: 120px; min-height: 150px; }
      .chat { height: 560px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .prog.run .prog-fill, .prog.run .runner { animation: none; }
      .prog-fill, .runner { transition: none; }
    }

    /* ====== Solo chat: el formulario se llena internamente ====== */
    body { padding: 1rem; }
    .layout { display: flex; justify-content: center; align-items: stretch; gap: 1.5rem; max-width: 1040px; }
    #formCard { display: none; }
    .chat {
      position: relative;
      top: auto;
      flex: 0 1 520px;
      width: 100%;
      max-width: 520px;
      height: calc(100dvh - 2rem);
      max-height: 860px;
    }
    .hero-full {
      display: none;
      flex: none;
      height: calc(100dvh - 2rem);
      max-height: 860px;
      aspect-ratio: 2 / 3;
      border-radius: 6px;
      border: 1px solid #1c2607;
      background: #000 var(--bot-img) center / cover no-repeat;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(146, 209, 0, 0.12);
    }
    @media (min-width: 1000px) { .hero-full { display: block; } }
    .msg.bot { white-space: pre-line; }
    .chat-msgs { min-height: 0; }
    .chat-msgs > * { flex-shrink: 0; }
    .chips { max-height: none; overflow: visible; }
    .chat-msgs::after { content: ""; display: block; height: 0.25rem; flex: none; }
    .prog-steps { grid-template-columns: repeat(5, 1fr); }
    .entrada-wrap { padding: 0.1rem 0 0.3rem; }
    .entrada { display: flex; gap: 0.4rem; align-items: center; }
    .chat .entrada input {
      flex: 1;
      min-width: 0;
      font-size: 1rem;
      color: #fff;
      background: #0f1508;
      border: 1px solid rgba(146, 209, 0, 0.7);
      border-radius: 999px;
      padding: 0.55rem 0.9rem;
    }
    .chat .entrada input::placeholder { color: #7d8c62; }
    .chat .entrada input:focus { outline: none; box-shadow: 0 0 0 3px rgba(146, 209, 0, 0.35); }
    .entrada-error { font-size: 0.8rem; color: #ff8a8a; margin: 0.3rem 0.4rem 0; }
    .entrada-error:empty { display: none; }
    @media (max-width: 520px) {
      body { padding: 0; overflow: hidden; }
      /* La altura sigue al área visible: cuando sale el teclado, el chat se encoge y la caja de texto queda a la vista */
      .chat { position: fixed; top: var(--vtop, 0px); left: 0; right: 0; width: auto; max-width: none; height: var(--vvh, 100dvh); max-height: none; border-radius: 0; border-left: 0; border-right: 0; }
      .prog-steps { font-size: 0.6rem; }
    }

    /* ====== Fondo animado (como el login del index) ====== */
    html, body { background: radial-gradient(circle at 15% 15%, #22320a 0%, #0d0f0b 65%) fixed; }
    #bgFx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
    #bgLogos { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
    .fl-logo {
      position: absolute; bottom: -160px; background: #fff; border-radius: 16px; padding: 8px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); opacity: 0;
      animation: flotarLogo linear infinite; will-change: transform, opacity;
    }
    .fl-logo img { display: block; height: 100%; width: auto; }
    @keyframes flotarLogo {
      0%   { transform: translateY(0) rotate(-8deg); opacity: 0; }
      12%  { opacity: var(--op, .25); }
      88%  { opacity: var(--op, .25); }
      100% { transform: translateY(-130vh) rotate(14deg); opacity: 0; }
    }
    .layout { position: relative; z-index: 2; }

    /* ====== Pantalla de "¡Listo!": BETABOT con like y globo de texto ====== */
    .gracias {
      position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center;
      padding: 1rem; background: rgba(5, 7, 3, 0.78); backdrop-filter: blur(4px);
      animation: fundido 0.3s both;
    }
    .gracias.hidden { display: none; }
    @keyframes fundido { from { opacity: 0; } to { opacity: 1; } }
    .gracias-card { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 1rem; width: 100%; max-width: 420px; }
    .gracias-globo {
      position: relative; background: #f4ffd6; color: #10160a; border-radius: 20px;
      padding: 1rem 1.25rem; text-align: center; font-size: 1.05rem; line-height: 1.4;
      box-shadow: 0 0 30px rgba(146, 209, 0, 0.45);
      animation: globo 0.55s 0.35s cubic-bezier(0.2, 1.4, 0.4, 1) both;
    }
    .gracias-globo strong { display: block; font-size: 1.3rem; margin-bottom: 0.2rem; }
    .gracias-globo::after {
      content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -12px;
      border: 12px solid transparent; border-bottom: 0; border-top-color: #f4ffd6;
    }
    @keyframes globo { from { opacity: 0; transform: scale(0.6) translateY(20px); } to { opacity: 1; transform: none; } }
    .gracias-escena { position: relative; height: min(44vh, 380px); aspect-ratio: 580 / 820; margin-top: 0.4rem; }
    .gracias-bot {
      position: absolute; inset: 0; border-radius: 18px; border: 1px solid rgba(146, 209, 0, 0.6);
      background: #000 var(--bot-img) no-repeat 42.8% 0 / 176.55% auto;
      box-shadow: 0 0 40px rgba(146, 209, 0, 0.5);

    }
    @keyframes saltito { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } 60% { transform: translateY(-12px); } }
    .gracias-like {
      position: absolute; right: -22px; bottom: 18%; width: 76px; height: 76px; border-radius: 50%;
      background: var(--blue); display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 4px #050703, 0 0 28px rgba(146, 209, 0, 0.9);
      animation: pop 0.7s 0.7s cubic-bezier(0.2, 1.6, 0.4, 1) both, latido 1.6s 1.5s ease-in-out infinite;

    @keyframes pop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(-8deg); } }
    @keyframes latido { 0%, 100% { transform: scale(1) rotate(-8deg); } 50% { transform: scale(1.12) rotate(-8deg); } }
    .gracias-ok {
      font: inherit; font-weight: 600; font-size: 1rem; color: #000; background: var(--blue);
      border: 0; border-radius: 999px; padding: 0.7rem 2.2rem; cursor: pointer;
      box-shadow: 0 0 18px rgba(146, 209, 0, 0.5);
    }
    .gracias-ok:hover { background: #a6ee00; }
    .gracias-ok.hidden { display: none; }
    .gracias-cuenta { color: #dfeabf; font-size: 0.95rem; min-height: 1.3em; text-align: center; }
    .chispa {
      position: absolute; bottom: -10px; width: 8px; height: 8px; border-radius: 50%; background: var(--blue);
      opacity: 0; animation: chispa linear infinite; pointer-events: none;
    }
    @keyframes chispa { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 0.9; } 100% { transform: translateY(-105vh); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .fl-logo, .chispa, .gracias-bot, .gracias-like, .gracias-globo { animation: none !important; }
      .fl-logo { opacity: 0.12; }
      .gracias-like, .gracias-globo { opacity: 1; }
    }

    /* ====== Nuevo BETABOT (robot blanco con verde) ====== */
    :root { --avatar-bg: #1b2a0b; }
    html[data-theme="light"] { --avatar-bg: #d9efa6; color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }

      background-color: var(--avatar-bg);

      background-size: calc(var(--d) * 1.2222) auto;
      background-position: calc(var(--d) * -0.0833) calc(var(--d) * 0.1833);
    }
    .hero-full {
      background-image:
        var(--bot-img),
        radial-gradient(60% 40% at 50% 100%, rgba(146, 209, 0, 0.35), transparent 70%),
        linear-gradient(135deg, #3b5a0a 0 14%, #274006 14% 28%, #0b0b0b 28% 46%, #0d130a 46% 100%);
      background-repeat: no-repeat;
      background-size: auto 90%, 100% 100%, 100% 100%;
      background-position: 50% 96%, center, center;
      background-color: #0d130a;
    }
    .gracias-escena { height: min(46vh, 400px); aspect-ratio: 808 / 1284; }
    .gracias-bot {
      border: 0; border-radius: 0; box-shadow: none;
      background: var(--bot-img) center / contain no-repeat;
      filter: drop-shadow(0 0 22px rgba(146, 209, 0, 0.6));
    }
    .gracias-escena { margin-right: 60px; }
    .gracias-like { right: -78px; top: 32%; bottom: auto; width: 64px; height: 64px; }
    .gracias-like svg { width: 36px; height: 36px; }
    .chat-restart.tema { padding: 0.25rem 0.5rem; font-size: 1rem; line-height: 1; }
    .chat-header { gap: 0.6rem; }

    /* ====== Modo claro ====== */
    html[data-theme="light"], html[data-theme="light"] body {
      background: radial-gradient(circle at 15% 15%, #e6f6c2 0%, #f7fbf1 55%, #eef5e2 100%) fixed;
    }
    html[data-theme="light"] .fl-logo { box-shadow: 0 8px 24px rgba(20, 60, 0, 0.12); }
    html[data-theme="light"] .hero-full {
      background-image:
        var(--bot-img),
        radial-gradient(60% 40% at 50% 100%, rgba(146, 209, 0, 0.35), transparent 70%),

  </style>
</head>
<body>
  <canvas id="bgFx" aria-hidden="true"></canvas>
  <div id="bgLogos" aria-hidden="true"></div>
  <div class="layout">

    <!-- ========== COLUMNA DEL CHAT ========== -->
    <div class="hero-full" role="img" aria-label="BETABOT, el asistente de Reclutamiento"></div>

    <aside class="chat" aria-label="Asistente de reclutamiento">
      <div class="chat-header">
        <div class="bot-face" aria-hidden="true"></div>
        <div class="chat-title">
          <strong>BETABOT</strong>
          <span>Asistente de Reclutamiento</span>
        </div>
        <button type="button" class="chat-restart tema" id="temaBtn" aria-label="Cambiar a modo claro" title="Modo claro">☀️</button>
        <button type="button" class="chat-restart" id="chatRestart">Reiniciar</button>
      </div>
      <div class="prog" id="prog" role="progressbar" aria-label="Avance de tu postulación" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
        <div class="prog-track" id="progTrack">
          <div class="prog-fill" id="progFill"></div>
          <span class="prog-meta" aria-hidden="true">🏁</span>
          <span class="bot-face runner" id="progRunner" aria-hidden="true"></span>
        </div>
        <ol class="prog-steps" id="progSteps"></ol>
      </div>
      
<div class="chat-msgs" id="chatMsgs" aria-live="polite"></div>
    </aside>

    <!-- ========== FORMULARIO ========== -->
    <div class="container" id="formCard">
      <div class="header">
        <div class="hero-bot" role="img" aria-label="BETABOT, el asistente de Reclutamiento"></div>
        <h2>Únete a nosotros</h2>
        <p>Completa tus datos y un agente de Reclutamiento te contactará.</p>
      </div>

      <form id="problemForm">
        <div class="field">
          <label for="apellidoP">Apellido paterno</label>
          <input type="text" id="apellidoP" placeholder="Apellido paterno" required />
        </div>
        <div class="field">
          <label for="apellidoM">Apellido materno</label>
          <input type="text" id="apellidoM" placeholder="Apellido materno" required />
        </div>
        <div class="field full">
          <label for="nombre">Nombre(s)</label>
          <input type="text" id="nombre" placeholder="Nombre" required />
        </div>
        <div class="field">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" placeholder="10 dígitos" maxlength="10" required />
        </div>
        <div class="field">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" placeholder="nombre@correo.com" required />
          <input type="hidden" id="ciudad" />
        </div>

        <div class="field full">
          <label for="estado">¿De qué estado nos escribes?</label>
          <select id="estado" required>
            <option value="">Cargando estados…</option>
          </select>
        </div>

        <div class="field full">
          <label for="vacante">¿Cuál es la vacante de tu interés?</label>
          <select id="vacante" required>
            <option value="">Cargando vacantes…</option>
          </select>
        </div>

        <fieldset class="full docs">
          <legend>Documentación</legend>
          <p class="docs-hint">Marca los documentos que tienes a la mano.</p>
          <label class="check"><input type="checkbox" name="docs" value="INE" /> INE</label>
          <label class="check" id="licenciaWrap"><input type="checkbox" name="docs" value="Licencia" id="licencia" /> Licencia de conducir</label>
          <label class="check" id="tarjetaWrap"><input type="checkbox" name="docs" value="Tarjeta de circulación" id="tarjeta" /> Tarjeta de circulación</label>
          <label class="check hidden" id="polizaWrap"><input type="checkbox" name="docs" value="Póliza de seguro" id="poliza" /> Póliza de seguro vigente</label>
          <label class="check"><input type="checkbox" name="docs" value="Número de cuenta" /> Número de cuenta</label>
          <label class="check"><input type="checkbox" name="docs" value="Comprobante de domicilio" /> Comprobante de domicilio</label>
          <label class="check"><input type="checkbox" name="docs" value="Constancia de situación fiscal" /> Constancia de situación fiscal</label>
          <p class="docs-note hidden" id="docsNote"></p>
        </fieldset>

        <button type="submit">Enviar postulación</button>
      </form>
      <div id="status" aria-live="polite"></div>
    </div>
  </div>

  <!-- ========== PANTALLA DE GRACIAS (BETABOT con like) ========== -->
  <div id="gracias" class="gracias hidden" role="dialog" aria-modal="true" aria-labelledby="graciasTitulo">
    <div class="gracias-card">
      <div class="gracias-globo">
        <strong id="graciasTitulo">¡Listo! 🎉</strong>
        <span>Tu postulación va en camino. Pronto serás contactado por un agente de Reclutamiento.</span>
      </div>
      <div class="gracias-escena">
        <div class="gracias-bot" role="img" aria-label="BETABOT con el pulgar arriba"></div>
        <div class="gracias-like" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
        </div>
      </div>
      <div class="gracias-cuenta" id="graciasCuenta" aria-live="polite"></div>
      <button type="button" class="gracias-ok" id="graciasAhora">Abrir WhatsApp ahora</button>
      <button type="button" class="gracias-ok hidden" id="graciasOk">Entendido</button>
    </div>
  </div>

  <script>
    const supportNumbers = [
      { number: '+525630283027', name: 'Reclutamiento' },
    ];

    // URL de la Web App de Apps Script (Code.gs de Vacantes). De aquí se leen las vacantes.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvzFqhI43uiOc4L0OAiPKwZvxuAeQqZz8irqIVPUjRmvfvLtauTCf3Nk38gORqPOBD/exec';

    // Solo se muestran vacantes con alguno de estos estatus
    const ESTATUS_ABIERTOS = ['VIGENTE', 'VIGENTE-REAPERTURADO'];

    // Listas de respaldo: se usan solo si no se pueden leer las vacantes del Sheet
    const ESTADOS_FIJOS = [
      'Ciudad de México', 'Estado de México', 'Puebla', 'Morelos', 'Hidalgo', 'Querétaro', 'Guerrero',
      'Aguascalientes', 'Baja California', 'Baja California Sur', 'Campeche', 'Chihuahua', 'Coahuila',
      'Chiapas', 'Colima', 'Durango', 'Guanajuato', 'Michoacan', 'Nayarit', 'Oaxaca', 'Quintana Roo',
      'San Luis Potosi', 'Sinaloa', 'Sonora', 'Tabasco', 'Tamaulipas', 'Tlaxcala', 'Veracruz',
      'Yucatan', 'Zacatecas'
    ];
    const VACANTES_FIJAS = [
      'OPERADOR CON AUTO', 'OPERADOR PARA CAMIONETA LARGE VAN', 'OPERADOR PARA CAMIONETA SMALL VAN',
      'OPERADOR CON MOTO', 'OPERADOR PARA AUTO', 'OPERADOR PARA MOTO', 'RECOLECTOR/PICKER', 'AUXILIAR'
    ];

    const form = document.getElementById('problemForm');
    const statusDiv = document.getElementById('status');
    const telefonoInput = document.getElementById('telefono');
    const estadoSelect = document.getElementById('estado');
    const vacanteSelect = document.getElementById('vacante');
    const tarjetaWrap = document.getElementById('tarjetaWrap');
    const polizaWrap = document.getElementById('polizaWrap');
    const licenciaWrap = document.getElementById('licenciaWrap');

    // Documentos que se piden según el puesto:
    //  - Operador con auto / moto propios y Shopper: tarjeta de circulación y póliza de seguro vigentes.
    //  - Licencia: solo si el puesto es para auto, camioneta, moto, van, operador o shopper.
    //    Recolector y Auxiliar NO llevan licencia.
    function requisitosDocs(vacante) {
      const v = String(vacante || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      const sinLicencia = /RECOLECTOR|AUXILIAR/.test(v);
      return {
        vehiculoPropio: v.startsWith('OPERADOR CON') || v.includes('SHOPPER'),
        licencia: !sinLicencia && /AUTO|CAMIONETA|MOTO|VAN|OPERADOR|SHOPPER/.test(v)
      };
    }
    const tarjetaInput = document.getElementById('tarjeta');
    const docsNote = document.getElementById('docsNote');

    let ciudadElegida = '';
    let vacantesAbiertas = []; // [{ estado, vacante, ciudad }] solo VIGENTE / VIGENTE-REAPERTURADO
    let docsTocados = false;

    /* ================== DATOS (Sheet) ================== */

    const norm = t => String(t || '').trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    // La ciudad puede venir como Ciudad, Municipio, Localidad o Plaza según el encabezado de la hoja
    function leerCiudad(f) {
      const llave = Object.keys(f).find(k => /CIUDAD|MUNICIPIO|LOCALIDAD|PLAZA/.test(norm(k)));
      return llave ? String(f[llave] || '').trim() : '';
    }

    async function cargarVacantes() {
      if (!APPS_SCRIPT_URL.startsWith('https://')) return;
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 12000);
      try {
        let filas = null;
        // 1) acción nueva (solo vacantes abiertas); 2) respaldo: todas y se filtran aquí
        try {
          const r = await fetch(APPS_SCRIPT_URL + '?accion=obtener_vacantes_abiertas', { signal: ctrl.signal });
          const d = await r.json();
          if (d && Array.isArray(d.vacantes)) filas = d.vacantes;
        } catch (e) { /* se intenta el respaldo */ }
        if (!filas) {
          const r = await fetch(APPS_SCRIPT_URL + '?accion=obtener_vacantes', { signal: ctrl.signal });
          const d = await r.json();
          if (Array.isArray(d)) filas = d;
        }
        if (!filas) return;
        const abrir = lista => lista
          .filter(f => ESTATUS_ABIERTOS.includes(String(f.EstatusVacante || '').trim().toUpperCase()))
          .map(f => ({ estado: String(f.Estado || '').trim(), vacante: String(f.Vacante || '').trim(), ciudad: leerCiudad(f) }))
          .filter(f => f.estado && f.vacante);
        if (filas[0]) console.info('Columnas que devuelve el Sheet:', Object.keys(filas[0]));
        vacantesAbiertas = abrir(filas);
        // Respaldo: si la lista de abiertas no trae la ciudad, se intenta con la lista completa
        if (vacantesAbiertas.length && !vacantesAbiertas.some(v => v.ciudad)) {
          try {
            const r = await fetch(APPS_SCRIPT_URL + '?accion=obtener_vacantes', { signal: ctrl.signal });
            const d = await r.json();
            if (Array.isArray(d)) {
              const completas = abrir(d);
              if (completas.some(v => v.ciudad)) vacantesAbiertas = completas;
            }
          } catch (e) { /* se queda sin ciudades */ }
        }
        if (vacantesAbiertas.length && !vacantesAbiertas.some(v => v.ciudad)) {
          console.warn('El Sheet no devolvió ninguna columna de ciudad. Revisa que el Apps Script la incluya.');
        }
      } catch (err) {
        console.error('No se pudieron leer las vacantes del Sheet:', err);
      } finally {
        clearTimeout(timer);
      }
    }

    // Estados disponibles (con número de vacantes vigentes si vienen del Sheet)
    function estadosDisponibles() {
      if (!vacantesAbiertas.length) return ESTADOS_FIJOS.map(e => ({ nombre: e, total: null }));
      const mapa = new Map();
      vacantesAbiertas.forEach(v => {
        const k = norm(v.estado);
        if (!mapa.has(k)) mapa.set(k, { nombre: v.estado, total: 0 });
        mapa.get(k).total++;
      });
      return [...mapa.values()].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    }

    // Ciudades con vacantes vigentes en un estado
    function ciudadesDeEstado(estado) {
      const mapa = new Map();
      vacantesAbiertas
        .filter(v => norm(v.estado) === norm(estado) && v.ciudad)
        .forEach(v => {
          const k = norm(v.ciudad);
          if (!mapa.has(k)) mapa.set(k, { nombre: v.ciudad, total: 0 });
          mapa.get(k).total++;
        });
      return [...mapa.values()].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    }

    // Vacantes disponibles en un estado (y en una ciudad, si se indica)
    function vacantesDeEstado(estado, ciudad) {
      if (!vacantesAbiertas.length) return VACANTES_FIJAS.map(v => ({ nombre: v, total: null }));
      const mapa = new Map();
      vacantesAbiertas
        .filter(v => norm(v.estado) === norm(estado) && (!ciudad || norm(v.ciudad) === norm(ciudad)))
        .forEach(v => {
          const k = norm(v.vacante);
          if (!mapa.has(k)) mapa.set(k, { nombre: v.vacante, total: 0 });
          mapa.get(k).total++;
        });
      return [...mapa.values()].sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    }

    function llenarEstados() {
      estadoSelect.innerHTML = '<option value="">Seleccione un estado</option>';
      estadosDisponibles().forEach(e => {
        const o = document.createElement('option');
        o.value = e.nombre;
        o.textContent = e.nombre;
        estadoSelect.appendChild(o);
      });
    }

    function llenarVacantes() {
      const estado = estadoSelect.value;
      vacanteSelect.innerHTML = '';
      if (vacantesAbiertas.length && !estado) {
        vacanteSelect.innerHTML = '<option value="">Primero selecciona un estado</option>';
        vacanteSelect.disabled = true;
        actualizarTarjeta();
        return;
      }
      vacanteSelect.disabled = false;
      vacanteSelect.innerHTML = '<option value="">Seleccione una vacante</option>';
      vacantesDeEstado(estado).forEach(v => {
        const o = document.createElement('option');
        o.value = v.nombre;
        o.textContent = v.nombre;
        vacanteSelect.appendChild(o);
      });
      actualizarTarjeta();
    }

    estadoSelect.addEventListener('change', llenarVacantes);

    /* ================== FORMULARIO ================== */

    // Validar que solo acepte números
    telefonoInput.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '');
    });

    // La tarjeta de circulación solo aplica a vacantes "CON" vehículo propio
    function actualizarTarjeta() {
      const req = requisitosDocs(vacanteSelect.value);
      const mostrar = (wrap, on) => {
        wrap.classList.toggle('hidden', !on);
        if (!on) wrap.querySelector('input').checked = false;
      };
      mostrar(tarjetaWrap, req.vehiculoPropio);
      mostrar(polizaWrap, req.vehiculoPropio);
      mostrar(licenciaWrap, req.licencia);
      actualizarNotaDocs();
    }
    vacanteSelect.addEventListener('change', actualizarTarjeta);

    function docsVisibles() {
      return [...document.querySelectorAll('input[name="docs"]')]
        .filter(c => !c.closest('label').classList.contains('hidden'));
    }

    function resumenDocumentos() {
      const visibles = docsVisibles();
      const tiene = visibles.filter(c => c.checked).map(c => c.value);
      const falta = visibles.filter(c => !c.checked).map(c => c.value);
      return {
        tiene: tiene.length ? tiene.join(', ') : 'Ninguno',
        falta: falta.length ? falta.join(', ') : 'Ninguno',
        listaTiene: tiene,
        listaFalta: falta
      };
    }

    // Aviso tranquilizador cuando falta algún documento (solo después de que el usuario interactúa)
    function actualizarNotaDocs() {
      const falta = docsVisibles().filter(c => !c.checked).map(c => c.value);
      if (!docsTocados || !falta.length) {
        docsNote.classList.add('hidden');
        return;
      }
      docsNote.textContent = 'No te preocupes 😊 por el momento hacemos el proceso sin: ' +
        falta.join(', ') + '; sin embargo es necesario que los tengas.';
      docsNote.classList.remove('hidden');
    }

    document.querySelectorAll('input[name="docs"]').forEach(c => {
      c.addEventListener('change', () => { docsTocados = true; actualizarNotaDocs(); });
    });

    function marcarDoc(valor, on) {
      const c = document.querySelector('input[name="docs"][value="' + valor + '"]');
      if (c) c.checked = on;
    }

    function limpiarDocs() {
      document.querySelectorAll('input[name="docs"]').forEach(c => { c.checked = false; });
      docsTocados = false;
      actualizarNotaDocs();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const apellidoP = document.getElementById('apellidoP').value;
      const apellidoM = document.getElementById('apellidoM').value;
      const nombre = document.getElementById('nombre').value;
      const telefono = document.getElementById('telefono').value;
      const correo = document.getElementById('correo').value;
      const vacante = vacanteSelect.value;
      const estado = estadoSelect.value;
      const ciudadMsg = (document.getElementById('ciudad').value || ciudadElegida || '').trim();

      // Validar que el correo contenga un @
      if (!correo.includes('@')) {
        alert('Por favor, ingresa un correo electrónico válido.');
        return;
      }

      const docs = resumenDocumentos();

      const random = supportNumbers[Math.floor(Math.random() * supportNumbers.length)];
      const assignedTo = random.name;

      // La solicitud NO se guarda en ninguna base de datos: solo se envía por WhatsApp.
      const message =
        `Hola ${assignedTo}, soy ${nombre} ${apellidoP} ${apellidoM}.\n` +
        `📞 Tel: ${telefono}\n` +
        `✉️ Correo: ${correo}\n` +
        `📍 Estado: ${estado}\n` +
        `🏙️ Ciudad: ${ciudadMsg || 'No indicada'}\n` +
        `💼 Vacante de interés: ${vacante}\n` +
        `📄 Documentos a la mano: ${docs.tiene}\n` +
        `⚠️ Me falta: ${docs.falta}`;
      const encoded = encodeURIComponent(message);
      const cleanedPhone = random.number.replace(/[^\d]/g, '');

      // wa.me es el enlace universal de WhatsApp (sirve como respaldo en cualquier dispositivo).
      const waUrl = `https://wa.me/${cleanedPhone}?text=${encoded}`;

      // Detección de celular que NO depende del user-agent: Chrome en "modo escritorio"
      // se presenta como computadora, pero sigue siendo un dispositivo táctil con pantalla pequeña.
      const ua = navigator.userAgent;
      const isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1); // iPad con iPadOS
      const pantallaChica = Math.min(screen.width, screen.height) <= 820;
      const puntero = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      const isMobile = /Android|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua) ||
        isIOS || puntero || (navigator.maxTouchPoints > 0 && pantallaChica);

      statusDiv.innerHTML = `<div class="success">✅ Abriendo WhatsApp para enviar tu postulación. Si no se abre, <a href="${waUrl}" target="_blank" rel="noopener">toca aquí</a>.</div>`;

      // WhatsApp se abre 15 segundos después de mostrar el mensaje de agradecimiento
      const abrirWhatsApp = () => {
        if (!isMobile) {
          const win = window.open(waUrl, '_blank');
          if (!win) window.location.href = waUrl;
        } else if (isIOS) {
          window.location.href = waUrl;
        } else {
          // Android (incluido Chrome en modo escritorio): abre la APP de WhatsApp;
          // si no está instalada, Chrome usa wa.me como respaldo.
          window.location.href =
            `intent://send/?phone=${cleanedPhone}&text=${encoded}` +
            `#Intent;scheme=whatsapp;S.browser_fallback_url=${encodeURIComponent(waUrl)};end`;
        }
      };

      form.reset();
      docsTocados = false;
      llenarVacantes();
      celebrar(abrirWhatsApp);
    });

    /* ================== MODO CLARO / OSCURO ================== */
    const temaBtn = document.getElementById('temaBtn');
    const temaActual = () => (document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
    function pintarBotonTema() {
      const claro = temaActual() === 'light';
      temaBtn.textContent = claro ? '🌙' : '☀️';
      temaBtn.setAttribute('aria-label', claro ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro');
      temaBtn.title = claro ? 'Modo oscuro' : 'Modo claro';
      const m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', claro ? '#f6faee' : '#050703');
    }
    temaBtn.addEventListener('click', () => {
      const nuevo = temaActual() === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', nuevo);
      try { localStorage.setItem('betabot-tema', nuevo); } catch (e) { /* sin almacenamiento */ }
      pintarBotonTema();
    });
    // Mientras la persona no elija, el tema sigue al del dispositivo
    try {
      matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
        let guardado = null;
        try { guardado = localStorage.getItem('betabot-tema'); } catch (_) { /* nada */ }
        if (!guardado) { document.documentElement.setAttribute('data-theme', e.matches ? 'light' : 'dark'); pintarBotonTema(); }
      });
    } catch (e) { /* navegador sin matchMedia */ }

        d.style.height = h + 'px';
        d.style.left = (Math.random() * 92) + '%';
        d.style.animationDuration = (16 + Math.random() * 16) + 's';
        d.style.animationDelay = (-Math.random() * 30) + 's';
        d.style.setProperty('--op', (0.12 + Math.random() * 0.2).toFixed(2));
        if (h < 50) d.style.filter = 'blur(1.5px)';
        const im = document.createElement('img');
        im.src = BET_LOGO;
        im.alt = '';
        d.appendChild(im);
        cont.appendChild(d);
      }

      const ctx = cv.getContext('2d');
      if (!ctx) return;
      let w = 0, h = 0;
      const pts = [];
      const reducir = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

      function medir() {
        const d = window.devicePixelRatio || 1;
        w = cv.clientWidth; h = cv.clientHeight;
        cv.width = w * d; cv.height = h * d;
        ctx.setTransform(d, 0, 0, d, 0, 0);
        const n = Math.max(25, Math.min(80, Math.floor(w * h / 16000)));
        while (pts.length < n) pts.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6 });
        pts.length = n;
      }
      window.addEventListener('resize', medir);

      function cuadro() {
        if (!document.hidden) {
          ctx.clearRect(0, 0, w, h);
          const col = temaActual() === 'light' ? '70,150,10' : '147,213,2';
          const dist = 150;
          for (const p of pts) {
            if (!reducir) {
              p.x += p.vx; p.y += p.vy;
              if (p.x < 0 || p.x > w) p.vx *= -1;
              if (p.y < 0 || p.y > h) p.vy *= -1;
            }
          }
          for (let i = 0; i < pts.length; i++) {
            for (let j = i + 1; j < pts.length; j++) {
              const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
              const d2 = dx * dx + dy * dy;
              if (d2 < dist * dist) {
                const a = (1 - Math.sqrt(d2) / dist) * 0.45;
                ctx.strokeStyle = 'rgba(' + col + ',' + a + ')';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
              }
            }
          }
          ctx.fillStyle = 'rgba(' + col + ',0.8)';
          for (const p of pts) { ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill(); }
        }
        if (!reducir) requestAnimationFrame(cuadro);
      }
      medir();
      cuadro();
    }
    iniciarFondo();

    /* ================== PANTALLA DE GRACIAS (BETABOT con like) ================== */
    const graciasEl = document.getElementById('gracias');
    const graciasOk = document.getElementById('graciasOk');
    const graciasAhora = document.getElementById('graciasAhora');
    const graciasCuenta = document.getElementById('graciasCuenta');
    let ultimoNombre = '';
    let esperandoWA = false;
    let waTimer = null;

    function mostrarGracias(abrirFn) {
      const primero = (ultimoNombre || '').trim().split(/\s+/)[0];
      document.getElementById('graciasTitulo').textContent = primero ? '¡Listo, ' + primero + '! 🎉' : '¡Listo! 🎉';
      graciasEl.querySelectorAll('.chispa').forEach(c => c.remove());
      for (let i = 0; i < 18; i++) {
        const c = document.createElement('span');
        c.className = 'chispa';
        c.style.left = (Math.random() * 100) + '%';
        c.style.animationDuration = (2.6 + Math.random() * 2.4) + 's';
        c.style.animationDelay = (Math.random() * 2) + 's';
        c.style.width = c.style.height = (5 + Math.random() * 7) + 'px';
        graciasEl.appendChild(c);
      }
      graciasEl.classList.remove('hidden');

      // El mensaje se queda 15 segundos y después se abre WhatsApp
      clearInterval(waTimer);
      if (!abrirFn) {
        esperandoWA = false;
        graciasCuenta.textContent = '';
        graciasAhora.classList.add('hidden');
        graciasOk.classList.remove('hidden');
        graciasOk.focus();
        return;
      }
      let seg = 15;
      esperandoWA = true;
      graciasAhora.classList.remove('hidden');
      graciasOk.classList.add('hidden');
      graciasCuenta.textContent = 'Abriendo WhatsApp en ' + seg + '…';
      const abrir = () => {
        if (!esperandoWA) return;
        esperandoWA = false;
        clearInterval(waTimer);
        abrirFn();
        graciasCuenta.textContent = 'WhatsApp abierto 💚';
        graciasAhora.classList.add('hidden');
        graciasOk.classList.remove('hidden');
        graciasOk.focus();
      };
      graciasAhora.onclick = abrir;
      graciasAhora.focus();
      waTimer = setInterval(() => {
        seg--;
        if (seg <= 0) abrir();
        else graciasCuenta.textContent = 'Abriendo WhatsApp en ' + seg + '…';
      }, 1000);
    }
    function cerrarGracias() { if (esperandoWA) return; graciasEl.classList.add('hidden'); }
    graciasOk.addEventListener('click', cerrarGracias);
    graciasEl.addEventListener('click', e => { if (e.target === graciasEl) cerrarGracias(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !graciasEl.classList.contains('hidden')) cerrarGracias(); });

    /* ================== PROGRESO (BETABOT corre hacia la meta) ================== */

    const PASOS = ['Estado', 'Vacante', 'Docs', 'Datos', 'Envío'];
    const progEl = document.getElementById('prog');
    const progFill = document.getElementById('progFill');
    const progRunner = document.getElementById('progRunner');
    const progTrack = document.getElementById('progTrack');
    const progSteps = document.getElementById('progSteps');
    let progTimer;

    PASOS.forEach((p, i) => {
      const li = document.createElement('li');
      li.textContent = p;
      progSteps.appendChild(li);
      if (i < PASOS.length - 1) {
        const d = document.createElement('i');
        d.className = 'prog-dot';
        d.style.left = ((i + 1) / PASOS.length * 100) + '%';
        progTrack.appendChild(d);
      }
    });

    function setProgreso(n) {
      const pct = n / PASOS.length * 100;
      progFill.style.width = pct + '%';
      progRunner.style.left = pct + '%';
      progEl.setAttribute('aria-valuenow', n);
      progEl.setAttribute('aria-valuetext', n >= PASOS.length ? 'Completado' : 'Paso actual: ' + PASOS[n]);
      progEl.classList.toggle('meta', n >= PASOS.length);
      progSteps.querySelectorAll('li').forEach((li, i) => {
        li.className = i < n ? 'hecho' : (i === n ? 'actual' : '');
      });
      progTrack.querySelectorAll('.prog-dot').forEach((d, i) => d.classList.toggle('on', i < n));
      progEl.classList.add('run');
      clearTimeout(progTimer);
      progTimer = setTimeout(() => progEl.classList.remove('run'), 900);
    }

    /* ================== CHAT GUIADO ================== */

    const chatMsgs = document.getElementById('chatMsgs');
    const ABORT = new Error('chat-reiniciado');
    let flowId = 0;
    let chatTermino = false;

    const esperar = ms => new Promise(r => setTimeout(r, ms));
    const scrollChat = () => {
      chatMsgs.scrollTop = chatMsgs.scrollHeight;
      requestAnimationFrame(() => { chatMsgs.scrollTop = chatMsgs.scrollHeight; });
    };

    function filaBot(contenido) {
      const fila = document.createElement('div');
      fila.className = 'fila bot';
      const cara = document.createElement('span');
      cara.className = 'bot-face';
      cara.setAttribute('aria-hidden', 'true');
      fila.appendChild(cara);
      fila.appendChild(contenido);
      return fila;
    }

    function addBubble(quien, contenido) {
      const d = document.createElement('div');
      d.className = 'msg ' + quien;
      if (typeof contenido === 'string') d.textContent = contenido; else d.appendChild(contenido);
      chatMsgs.appendChild(quien === 'bot' ? filaBot(d) : d);
      scrollChat();
      return d;
    }

    async function botSay(texto, id) {
      const typing = document.createElement('div');
      typing.className = 'msg bot typing';
      typing.innerHTML = '<span></span><span></span><span></span>';
      const fila = filaBot(typing);
      chatMsgs.appendChild(fila);
      scrollChat();
      await esperar(Math.min(350 + texto.length * 7, 1000));
      if (id !== flowId) throw ABORT;
      fila.remove();
      addBubble('bot', texto);
    }

    function crearChip(texto, clase) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (clase ? ' ' + clase : '');
      b.textContent = texto;
      return b;
    }

    // Una sola opción
    function opcionesUnica(opciones, id) {
      return new Promise(resolve => {
        const cont = document.createElement('div');
        cont.className = 'chips';
        opciones.forEach(o => {
          const b = crearChip(o.label, o.primary ? 'primary' : '');
          b.addEventListener('click', () => {
            if (id !== flowId) return;
            cont.remove();
            addBubble('user', o.label);
            resolve(o.value);
          });
          cont.appendChild(b);
        });
        chatMsgs.appendChild(cont);
        scrollChat();
      });
    }

    // Varias opciones (se marcan y se confirma con "Listo")
    function opcionesMulti(opciones, id) {
      return new Promise(resolve => {
        const cont = document.createElement('div');
        cont.className = 'chips';
        const elegidas = new Set();
        opciones.forEach(o => {
          const b = crearChip(o);
          b.setAttribute('aria-pressed', 'false');
          b.addEventListener('click', () => {
            if (elegidas.has(o)) elegidas.delete(o); else elegidas.add(o);
            b.classList.toggle('on', elegidas.has(o));
            b.setAttribute('aria-pressed', elegidas.has(o) ? 'true' : 'false');
          });
          cont.appendChild(b);
        });
        const ok = crearChip('Listo ✔', 'primary');
        ok.addEventListener('click', () => {
          if (id !== flowId) return;
          cont.remove();
          const arr = opciones.filter(o => elegidas.has(o));
          addBubble('user', arr.length ? arr.join(', ') : 'Ninguno por ahora');
          resolve(arr);
        });
        cont.appendChild(ok);
        chatMsgs.appendChild(cont);
        scrollChat();
      });
    }

    // Pide un dato escrito dentro del chat
    function pedirTexto(o, id) {
      return new Promise(resolve => {
        const wrap = document.createElement('div');
        wrap.className = 'entrada-wrap';
        const fila = document.createElement('div');
        fila.className = 'entrada';
        const input = document.createElement('input');
        input.type = o.tipo || 'text';
        input.placeholder = o.placeholder || '';
        input.autocomplete = o.auto || 'off';
        if (o.tipo === 'tel') { input.inputMode = 'numeric'; input.maxLength = 10; }
        const ok = crearChip('Enviar', 'primary');
        const err = document.createElement('div');
        err.className = 'entrada-error';
        const enviar = () => {
          if (id !== flowId) return;
          let v = input.value.trim();
          if (o.limpiar) v = o.limpiar(v);
          const m = o.validar ? o.validar(v) : (v.length < 2 ? 'Escribe al menos 2 letras.' : null);
          if (m) { err.textContent = m; input.focus(); return; }
          wrap.remove();
          addBubble('user', v);
          resolve(v);
        };
        ok.addEventListener('click', enviar);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); enviar(); } });
        input.addEventListener('focus', () => setTimeout(() => { if (wrap.scrollIntoView) wrap.scrollIntoView({ block: 'end' }); scrollChat(); }, 350));
        if (o.tipo === 'tel') input.addEventListener('input', () => { input.value = input.value.replace(/\D/g, ''); });
        fila.appendChild(input);
        fila.appendChild(ok);
        wrap.appendChild(fila);
        wrap.appendChild(err);
        chatMsgs.appendChild(wrap);
        scrollChat();
        setTimeout(() => input.focus({ preventScroll: true }), 60);
      });
    }

    async function pedirDatos(id) {
      await botSay('¡Último paso! 📝 Ahora tus datos para que el reclutador te contacte. ¿Cuál es tu apellido paterno?', id);
      const apellidoP = await pedirTexto({ placeholder: 'Apellido paterno', auto: 'family-name' }, id);
      await botSay('¿Y tu apellido materno?', id);
      const apellidoM = await pedirTexto({ placeholder: 'Apellido materno' }, id);
      await botSay('¿Cuál es tu nombre o nombres?', id);
      const nombre = await pedirTexto({ placeholder: 'Nombre(s)', auto: 'given-name' }, id);
      await botSay('¿A qué teléfono de 10 dígitos te contactamos?', id);
      const telefono = await pedirTexto({
        tipo: 'tel', placeholder: '10 dígitos', auto: 'tel',
        limpiar: v => v.replace(/\D/g, ''),
        validar: v => (v.length === 10 ? null : 'Escribe los 10 dígitos de tu teléfono.')
      }, id);
      await botSay('Por último, ¿cuál es tu correo electrónico?', id);
      const correo = await pedirTexto({
        tipo: 'email', placeholder: 'nombre@correo.com', auto: 'email',
        validar: v => (/^\S+@\S+\.\S+$/.test(v) ? null : 'Escribe un correo válido, por ejemplo nombre@correo.com')
      }, id);
      return { apellidoP, apellidoM, nombre, telefono, correo };
    }

    // El formulario sigue existiendo, pero oculto: aquí se llena con lo que se capturó en el chat
    function llenarFormulario(d) {
      document.getElementById('apellidoP').value = d.apellidoP;
      document.getElementById('apellidoM').value = d.apellidoM;
      document.getElementById('nombre').value = d.nombre;
      document.getElementById('telefono').value = d.telefono;
      document.getElementById('correo').value = d.correo;
    }

    // Mide el área realmente visible (sin teclado) para que el chat nunca quede tapado
    (function ajustarTeclado() {
      const vv = window.visualViewport;
      if (!vv) return;
      const aplicar = () => {
        const r = document.documentElement.style;
        r.setProperty('--vvh', vv.height + 'px');
        r.setProperty('--vtop', vv.offsetTop + 'px');
        const a = document.activeElement;
        if (a && a.closest && a.closest('.entrada')) scrollChat();
      };
      vv.addEventListener('resize', aplicar);
      vv.addEventListener('scroll', aplicar);
      aplicar();
    })();

    async function correrChat() {
      const id = ++flowId;
      chatMsgs.innerHTML = '';
      chatTermino = false;
      setProgreso(0);

      try {
        await botSay('¡Hola! 👋 Soy BETABOT, el asistente de Reclutamiento. Te ayudo a consultar las vacantes disponibles y a preparar tu postulación.', id);
        await datosListos;
        if (id !== flowId) throw ABORT;

        /* --- 1. Estado y vacante --- */
        let estado, vacante, ciudad = '';
        paso1: while (true) {
          const estados = estadosDisponibles();
          await botSay(vacantesAbiertas.length
            ? 'Primero, ¿de qué estado nos escribes? Estos son los estados con vacantes vigentes:'
            : '¿De qué estado nos escribes?', id);
          estado = await opcionesUnica(estados.map(e => ({
            label: e.total ? `${e.nombre} (${e.total})` : e.nombre,
            value: e.nombre
          })), id);
          estadoSelect.value = estado;
          llenarVacantes();
          setProgreso(1);

          // Ciudades disponibles del estado elegido
          while (true) {
            const ciudades = ciudadesDeEstado(estado);
            ciudad = '';
            if (ciudades.length) {
              await botSay(`Estas son las ciudades con vacantes vigentes en ${estado} 📍 ¿En cuál te queda mejor?`, id);
              const opcCiudad = ciudades.map(c => ({ label: `${c.nombre} (${c.total})`, value: c.nombre }));
              opcCiudad.push({ label: '↩ Cambiar de estado', value: '__estado' });
              const c = await opcionesUnica(opcCiudad, id);
              if (c === '__estado') { setProgreso(0); continue paso1; }
              ciudad = c;
            }

            const vacs = vacantesDeEstado(estado, ciudad);
            await botSay(`Estas son las vacantes vigentes en ${ciudad ? ciudad + ', ' : ''}${estado}. ¿Cuál te interesa?`, id);
            const opciones = vacs.map(v => ({
              label: v.total ? `${v.nombre} (${v.total})` : v.nombre,
              value: v.nombre
            }));
            if (ciudades.length) opciones.push({ label: '↩ Cambiar de ciudad', value: '__ciudad' });
            opciones.push({ label: '↩ Cambiar de estado', value: '__estado' });
            const sel = await opcionesUnica(opciones, id);
            if (sel === '__estado') { setProgreso(0); continue paso1; }
            if (sel === '__ciudad') continue;
            vacante = sel;
            break paso1;
          }
        }
        ciudadElegida = ciudad;
        vacanteSelect.value = vacante;
        actualizarTarjeta();
        setProgreso(2);

        /* --- 2. Documentos: solo se pregunta si los tiene vigentes y a la mano --- */
        await botSay(`¡Excelente elección! 🎯 ${vacante}. Ahora una pregunta rápida sobre tus documentos.`, id);

        const req = requisitosDocs(vacante);
        const docsLista = ['INE'];
        if (req.licencia) docsLista.push('Licencia de conducir');
        if (req.vehiculoPropio) docsLista.push('Tarjeta de circulación', 'Póliza de seguro');
        docsLista.push('Número de cuenta', 'Comprobante de domicilio', 'Constancia de situación fiscal');
        const valorDoc = d => (d === 'Licencia de conducir' ? 'Licencia' : d);

        await botSay('¿Cuáles de estos documentos tienes vigentes y a la mano? Márcalos y toca "Listo".', id);
        const tiene = await opcionesMulti(docsLista, id);
        docsLista.forEach(d => marcarDoc(valorDoc(d), tiene.includes(d)));
        const faltan = docsLista.filter(d => !tiene.includes(d));
        if (faltan.length) {
          await botSay('No te preocupes 😊 por el momento hacemos el proceso sin: ' + faltan.join(', ') +
            '; sin embargo es necesario que los tengas vigentes.', id);
        } else {
          await botSay('¡Excelente! 🙌 Tienes toda tu documentación.', id);
        }
        setProgreso(3);

        docsTocados = true;
        actualizarNotaDocs();

        /* --- 4. Datos personales (se pasan al formulario interno) --- */
        let datos = await pedirDatos(id);
        while (true) {
          setProgreso(4);
          await botSay(
            'Revisa que todo esté bien:\n' +
            `👤 ${datos.nombre} ${datos.apellidoP} ${datos.apellidoM}\n` +
            `📞 ${datos.telefono}\n` +
            `✉️ ${datos.correo}\n` +
            `📍 ${ciudad ? ciudad + ', ' : ''}${estado}\n` +
            `💼 ${vacante}`, id);
          const acc = await opcionesUnica([
            { label: '✅ Enviar por WhatsApp', value: 'enviar', primary: true },
            { label: '✏️ Corregir mis datos', value: 'corregir' },
            { label: '🔄 Empezar de nuevo', value: 'reiniciar' }
          ], id);
          if (acc === 'reiniciar') { reiniciarChat(); return; }
          if (acc === 'corregir') { datos = await pedirDatos(id); continue; }
          llenarFormulario(datos);
          if (!form.checkValidity()) {
            await botSay('Falta algún dato. Vamos a capturarlo de nuevo.', id);
            datos = await pedirDatos(id);
            continue;
          }
          document.getElementById('ciudad').value = ciudad;
          chatTermino = true;
          ultimoNombre = datos.nombre;
          if (form.requestSubmit) form.requestSubmit();
          else form.dispatchEvent(new Event('submit', { cancelable: true }));
          break;
        }

        await opcionesUnica([{ label: '🔄 Nueva postulación', value: 'nueva', primary: true }], id);
        reiniciarChat();
      } catch (err) {
        if (err !== ABORT) console.error(err);
      }
    }

    // Al enviar el formulario: BETABOT llega a la meta
    function celebrar(abrirFn) {
      setProgreso(PASOS.length);
      mostrarGracias(abrirFn);
      if (chatTermino) addBubble('bot', '🚀 ¡Postulación en camino! Gracias por escribirnos. Pronto serás contactado por un agente de Reclutamiento 💚');
    }

    function reiniciarChat() {
      ciudadElegida = '';
      form.reset();
      limpiarDocs();
      estadoSelect.value = '';
      llenarVacantes();
      correrChat();
    }

    document.getElementById('chatRestart').addEventListener('click', reiniciarChat);

    /* ================== ARRANQUE ================== */

    // Mientras se leen las vacantes, los selects muestran "Cargando…"; después se llenan
    // con las vacantes vigentes (o con las listas de respaldo si el Sheet no responde).
    const datosListos = cargarVacantes().then(() => {
      llenarEstados();
      llenarVacantes();
    });

    correrChat();
  </script>
</body>
</html>
