<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reclutamiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #000000;
      --navy-dark: #1a1a1a;
      --blue: #92d100;
      --bg: #f2f3f0;
      --surface: #ffffff;
      --text: #1b2733;
      --muted: #5b6b7b;
      --border: #c9d2dc;
      --success-bg: #e8f3ec;
      --success-text: #1e5b35;
      --error-bg: #fbeaea;
      --error-text: #8a1f1f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    .header {
      background: var(--navy);
      color: #fff;
      padding: 1.75rem 2rem;
      border-bottom: 4px solid var(--blue);
    }
    .header h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .header p {
      margin: 0.35rem 0 0;
      font-size: 0.95rem;
      color: #d4d4d4;
    }

    form {
      padding: 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.1rem 1rem;
    }
    .field { display: flex; flex-direction: column; }
    .full { grid-column: 1 / -1; }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    input, select {
      width: 100%;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
      padding: 0.65rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder { color: #8a97a5; }
    input:focus, select:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(146, 209, 0, 0.35);
    }

    button {
      grid-column: 1 / -1;
      margin-top: 0.5rem;
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      color: #000;
      background: var(--blue);
      border: 1px solid var(--blue);
      border-radius: 4px;
      padding: 0.8rem 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #7db800; border-color: #7db800; }
    button:focus-visible {
      outline: 3px solid rgba(146, 209, 0, 0.6);
      outline-offset: 2px;
    }

    #status { padding: 0 2rem 2rem; }
    #status:empty { padding: 0; }
    .success, .error {
      padding: 0.9rem 1rem;
      border-radius: 4px;
      font-size: 0.95rem;
      border-left: 4px solid;
    }
    .success {
      background: var(--success-bg);
      color: var(--success-text);
      border-color: #2e7d4f;
    }
    .error {
      background: var(--error-bg);
      color: var(--error-text);
      border-color: #b33a3a;
    }


    fieldset.docs {
      border: 1px solid var(--border);
      border-radius: 4px;
      margin: 0;
      padding: 0.9rem 1rem 1rem;
    }
    fieldset.docs legend {
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0 0.4rem;
    }
    .docs-hint {
      margin: 0 0 0.6rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    label.check {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0;
      padding: 0.45rem 0;
      font-weight: 400;
      font-size: 0.95rem;
      cursor: pointer;
    }
    label.check input[type="checkbox"] {
      width: 1.15rem;
      height: 1.15rem;
      padding: 0;
      margin: 0;
      flex: none;
      accent-color: var(--blue);
    }
    .hidden { display: none !important; }

    @media (max-width: 520px) {
      body { padding: 0; }
      .container { border-radius: 0; border-left: 0; border-right: 0; }
      form { grid-template-columns: 1fr; padding: 1.5rem; }
      .header { padding: 1.5rem; }
      #status { padding: 0 1.5rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Únete a nosotros</h2>
      <p>Completa tus datos y un agente de Reclutamiento te contactará.</p>
    </div>

    <form id="problemForm">
      <div class="field">
        <label for="apellidoP">Apellido paterno</label>
        <input type="text" id="apellidoP" placeholder="Apellido paterno" required />
      </div>
      <div class="field">
        <label for="apellidoM">Apellido materno</label>
        <input type="text" id="apellidoM" placeholder="Apellido materno" required />
      </div>
      <div class="field full">
        <label for="nombre">Nombre(s)</label>
        <input type="text" id="nombre" placeholder="Nombre" required />
      </div>
      <div class="field">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" placeholder="10 dígitos" maxlength="10" required />
      </div>
      <div class="field">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" placeholder="nombre@correo.com" required />
      </div>

      <div class="field full">
        <label for="vacante">¿Cuál es la vacante de tu interés?</label>
        <select id="vacante" required>
          <option value="">Seleccione una vacante</option>
          <option value="OPERADOR CON AUTO">OPERADOR CON AUTO</option>
          <option value="OPERADOR CON AUTO">OPERADOR PARA AUTO</option>
          <option value="OPERADOR CON CAMIONETA LARGE VAN">OPERADOR CON CAMIONETA LARGE VAN</option>
          <option value="OPERADOR CON CAMIONETA LARGE VAN">OPERADOR PARA CAMIONETA LARGE VAN</option>
          <option value="OPERADOR CON CAMIONETA SMALL VAN">OPERADOR CON CAMIONETA SMALL VAN</option>
          <option value="OPERADOR CON CAMIONETA SMALL VAN">OPERADOR PARA CAMIONETA SMALL VAN</option>
          <option value="OPERADOR CON MOTO">OPERADOR CON MOTO</option>
          <option value="OPERADOR CON MOTO">OPERADOR PARA MOTO</option>
          <option value="RECOLECTOR/PICKER">RECOLECTOR/PICKER</option>
          <option value="RECOLECTOR/PICKER">AUXILIAR</option>
        </select>
      </div>

      <div class="field full">
        <label for="estado">¿De qué estado nos escribes?</label>
        <select id="estado" required>
          <option value="">Seleccione un estado</option>
          <option value="Ciudad de México">Ciudad de México</option>
          <option value="Estado de México">Estado de México</option>
          <option value="Puebla">Puebla</option>
          <option value="Morelos">Morelos</option>
          <option value="Hidalgo">Hidalgo</option>
          <option value="Querétaro">Querétaro</option>
          <option value="Guerrero">Guerrero</option>
          <option value="Aguascalientes">Aguascalientes</option>
          <option value="Baja California">Baja California</option>
          <option value="Baja California Sur">Baja California Sur</option>
          <option value="Campeche">Campeche</option>
          <option value="Chihuahua">Chihuahua</option>
          <option value="Coahuila">Coahuila</option>
          <option value="Chiapas">Chiapas</option>
          <option value="Colima">Colima</option>
          <option value="Durango">Durango</option>
          <option value="Guanajuato">Guanajuato</option>
          <option value="Michoacan">Michoacan</option>
          <option value="Nayarit">Nayarit</option>
          <option value="Oaxaca">Oaxaca</option>
          <option value="Quitana Roo">Quintana Roo</option>
          <option value="San Luis Potosi">San Luis Potosi</option>
          <option value="Sinaloa">Sinaloa</option>
          <option value="Sonora">Sonora</option>
          <option value="Tabasco">Tabasco</option>
          <option value="Tamaulipas">Tamaulipas</option>
          <option value="Tlaxcala">Tlaxcala</option>
          <option value="Veracruz">Veracruz</option>
          <option value="Yucatan">Yucatan</option>
          <option value="Zacatecas">Zacatecas</option>
        </select>
      </div>

      <fieldset class="full docs">
        <legend>Documentación</legend>
        <p class="docs-hint">Marca los documentos que tienes a la mano.</p>
        <label class="check"><input type="checkbox" name="docs" value="INE" /> INE</label>
        <label class="check"><input type="checkbox" name="docs" value="Licencia" /> Licencia de conducir</label>
        <label class="check" id="tarjetaWrap"><input type="checkbox" name="docs" value="Tarjeta de circulación" id="tarjeta" /> Tarjeta de circulación</label>
        <label class="check"><input type="checkbox" name="docs" value="Número de cuenta" /> Número de cuenta</label>
        <label class="check"><input type="checkbox" name="docs" value="Comprobante de domicilio" /> Comprobante de domicilio</label>
        <label class="check"><input type="checkbox" name="docs" value="Constancia de situación fiscal" /> Constancia de situación fiscal</label>
      </fieldset>

      <button type="submit">Enviar solicitud</button>
    </form>
    <div id="status" aria-live="polite"></div>
  </div>

  <script>
    const supportNumbers = [
      { number: '+525633940584', name: 'Reclutamiento' },
    ];

    const form = document.getElementById('problemForm');
    const statusDiv = document.getElementById('status');
    const telefonoInput = document.getElementById('telefono');

    // Validar que solo acepte números
    telefonoInput.addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, ""); // Elimina todo lo que no sea número
    });


    // La tarjeta de circulación solo aplica a vacantes "CON" vehículo propio
    const vacanteSelect = document.getElementById('vacante');
    const tarjetaWrap = document.getElementById('tarjetaWrap');
    const tarjetaInput = document.getElementById('tarjeta');

    function actualizarTarjeta() {
      const conVehiculo = vacanteSelect.value.startsWith('OPERADOR CON');
      tarjetaWrap.classList.toggle('hidden', !conVehiculo);
      if (!conVehiculo) tarjetaInput.checked = false;
    }
    vacanteSelect.addEventListener('change', actualizarTarjeta);
    actualizarTarjeta();

    function resumenDocumentos() {
      const visibles = [...document.querySelectorAll('input[name="docs"]')]
        .filter(c => !c.closest('label').classList.contains('hidden'));
      const tiene = visibles.filter(c => c.checked).map(c => c.value);
      const falta = visibles.filter(c => !c.checked).map(c => c.value);
      return {
        tiene: tiene.length ? tiene.join(', ') : 'Ninguno',
        falta: falta.length ? falta.join(', ') : 'Ninguno'
      };
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const apellidoP = document.getElementById('apellidoP').value;
      const apellidoM = document.getElementById('apellidoM').value;
      const nombre = document.getElementById('nombre').value;
      const telefono = document.getElementById('telefono').value;
      const correo = document.getElementById('correo').value;
      const vacante = document.getElementById('vacante').value;
      const estado = document.getElementById('estado').value;

      // Validar que el correo contenga un @
      if (!correo.includes("@")) {
        alert("Por favor, ingresa un correo electrónico válido.");
        return;
      }

      const docs = resumenDocumentos();

      const random = supportNumbers[Math.floor(Math.random() * supportNumbers.length)];
      const assignedTo = random.name;

      try {
        const response = await fetch('https://sheetdb.io/api/v1/94iczesssrp5n', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            apellidoP,
            apellidoM,
            nombre,
            telefono,
            correo,
            vacante,
            estado,
            assignedTo,
            documentacion: `Tiene: ${docs.tiene} | Le falta: ${docs.falta}`,
            timestamp: new Date().toLocaleString("es-MX", { timeZone: "America/Mexico_City" })
          })
        });

        if (!response.ok) throw new Error('No se pudo enviar.');

        statusDiv.innerHTML = `<div class="success">✅ Datos enviados correctamente. En un momento un agente se pondrá en contacto contigo.</div>`;

        const message = `Hola ${assignedTo}, soy ${nombre} ${apellidoP} ${apellidoM}. 📞 Tel: ${telefono} Del Estado: ${estado} 💼 Mi Vacante de interés es: ${vacante}. 📄 Documentos a la mano: ${docs.tiene}. Me falta: ${docs.falta}`;
        const encoded = encodeURIComponent(message);
        const cleanedPhone = random.number.replace(/[^\d]/g, '');
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        setTimeout(() => {
          if (isMobile) {
            window.location.href = `whatsapp://send?phone=${cleanedPhone}&text=${encoded}`;
          } else {
            window.open(`https://web.whatsapp.com/send?phone=${cleanedPhone}&text=${encoded}`, '_blank');
          }
        }, 1000);

        form.reset();
        actualizarTarjeta();
      } catch (error) {
        console.error(error);
        statusDiv.innerHTML = `<div class="error">❌ Hubo un error al enviar el formulario.</div>`;
      }
    });
  </script>
</body>
</html>
